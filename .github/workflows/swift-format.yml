name: Swift format

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  lint:
    runs-on: xcode-27
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4

      - name: Show swift-format version
        run: xcrun swift-format --version

      - name: Check formatting
        run: xcrun swift-format lint --strict --recursive --parallel TD-app
